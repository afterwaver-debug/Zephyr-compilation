
name: Build Zephyr for Windows

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build Zephyr
        run: >
          dotnet publish Zephyr.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -o artifacts/Zephyr

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: Zephyr-win-x64
          path: artifacts/Zephyr/Zephyr.exe
          if-no-files-found: error
